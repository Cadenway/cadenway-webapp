# Definition of webapp for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/webapp.yaml for the environment it deploys to.
#
# Static files served on app.<domain> through Traefik. The gateway addresses are not in the image:
# the environment mounts them as config.json, so the same image runs in staging and in production.
services:
  webapp:
    image: ghcr.io/${GHCR_OWNER}/cadenway-webapp:${WEBAPP_VERSION}
    restart: unless-stopped
    networks:
      - edge
    # The environment in the router, service and network names keeps two stacks apart on one shared
    # Traefik.
    labels:
      - traefik.enable=true
      - traefik.docker.network=cadenway-edge-${ENVIRONMENT:-local}
      - traefik.http.routers.webapp-${ENVIRONMENT:-local}.rule=Host(`app.${DOMAIN}`)
      - traefik.http.services.webapp-${ENVIRONMENT:-local}.loadbalancer.server.port=8080
    configs:
      - source: webapp-config
        target: /usr/share/nginx/html/config.json
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M

configs:
  webapp-config:
    content: |
      {
        "apiUrl": "${PUBLIC_SCHEME:-https}://api.${DOMAIN}",
        "realtimeUrl": "${PUBLIC_SCHEME:-https}://realtime.${DOMAIN}"
      }

# Declared identically by cadenway-ops and by every definition it includes.
networks:
  # One edge network per environment, created on the host by the edge Traefik (cadenway-ops
  # compose/edge.yaml): staging and production containers never share a network.
  edge:
    name: cadenway-edge-${ENVIRONMENT:-local}
    external: true
