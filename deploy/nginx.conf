# Each locale is a separate build served below its own segment: /en/ (English, the source copy)
# and /fr/. Organization slugs follow the segment (/fr/atelier-nord/home), so no slug is reserved
# for it. Any other path, the root and the slug-less links the backend sends (/login/code, /reset,
# /invite/:id, /home, /auth/federated/continue?…) included, is redirected below a locale.

# The browser's first supported language (primary subtag), English when none is.
map $http_accept_language $cw_accept_language {
  default '';
  "~*^(?:[^,]*,)*?\s*(en|fr)(?:-[^,;]*)?\s*(?:;[^,]*)?(?:,|$)" $1;
}

map $cw_accept_language $cw_accept_locale {
  default en;
  ~*^fr$ fr;
}

# The locale chosen in the application (the cw_locale cookie, a locale code only) wins.
map $cookie_cw_locale $cw_locale {
  default $cw_accept_locale;
  en en;
  fr fr;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Redirects keep the scheme and host the browser used (TLS ends at Traefik): relative Location.
  absolute_redirect off;

  # Probed by the container healthcheck.
  location = /health/ready {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Mounted by the environment at the site root, beside the locale builds: never cached, so a new
  # deployment takes effect at once.
  location = /config.json {
    add_header Cache-Control 'no-store';
    try_files $uri =404;
  }

  location = /en {
    return 301 /en/$is_args$args;
  }

  location = /fr {
    return 301 /fr/$is_args$args;
  }

  # Build files carry a content hash in their name and never change.
  location ~* ^/(?:en|fr)/.+\.(?:js|css|woff2)$ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # The entry document of a locale names the hashed files of the current build: always
  # revalidated.
  location ~ ^/(?:en|fr)/index\.html$ {
    add_header Cache-Control 'no-cache';
  }

  # Client-side routing: an unknown path below a locale is answered by that locale's application.
  location ~ ^/(?<cw_segment>en|fr)/ {
    try_files $uri $uri/ /$cw_segment/index.html;
  }

  # Anything else opens below the chosen locale, query kept; the browser keeps the fragment (the
  # reset token of /reset#…). The answer depends on the cookie and the browser language.
  location / {
    add_header Vary 'Accept-Language, Cookie' always;
    add_header Cache-Control 'no-store' always;
    return 302 /$cw_locale$request_uri;
  }
}
