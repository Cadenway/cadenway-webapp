server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Probed by the container healthcheck.
  location = /health/ready {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Mounted by the environment: never cached, so a new deployment takes effect at once.
  location = /config.json {
    add_header Cache-Control 'no-store';
  }

  # The entry document names the hashed files of the current build: always revalidated.
  location = /index.html {
    add_header Cache-Control 'no-cache';
  }

  # Build files carry a content hash in their name and never change.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # Client-side routing: an unknown path is answered by the application.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
