<div class="flex h-screen overflow-hidden bg-canvas font-sans text-sm text-foreground antialiased">
  <nav
    cwAppRail
    phoneLayout="column"
    ariaLabel="Applications"
    i18n-ariaLabel="@@layouts.settings-shell.rail"
  >
    @for (group of railNavigation; track group.id) {
      <ng-container *ngComponentOutlet="group.component; inputs: group.inputs" />
    }
    @if (railFooter.length > 0) {
      <cw-app-rail-footer>
        @for (item of railFooter; track item.id) {
          <ng-container *ngComponentOutlet="item.component; inputs: item.inputs" />
        }
      </cw-app-rail-footer>
    }
  </nav>

  <div
    class="mt-2 mr-2 mb-2 flex min-w-0 flex-1 flex-wrap content-start overflow-y-auto rounded-xl border border-border bg-background md:flex-nowrap md:content-stretch md:overflow-hidden"
  >
    @if (settingsNavigation.length > 0) {
      <nav
        [attr.aria-label]="navigationLabel()"
        class="flex w-full shrink-0 flex-col gap-3 border-sidebar-border bg-sidebar p-2 text-sidebar-foreground max-md:border-b md:h-full md:w-60 md:border-r"
      >
        @for (group of settingsNavigation; track group.id) {
          <ng-container *ngComponentOutlet="group.component; inputs: group.inputs" />
        }
      </nav>
    }

    <main class="min-w-0 flex-[999_1_560px] md:h-full md:overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
