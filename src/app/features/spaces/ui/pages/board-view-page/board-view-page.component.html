<div
  class="flex min-h-0 flex-1 items-center justify-center px-4 pb-6 sm:px-6"
  data-testid="board-view"
>
  <cw-empty role="status">
    <cw-empty-header>
      <cw-empty-media>
        <ng-icon [name]="icon" aria-hidden="true" />
      </cw-empty-media>
      <cw-empty-title>{{ name }}</cw-empty-title>
      <cw-empty-description i18n="@@spaces.view-stub.text"
        >This view is not available yet.</cw-empty-description
      >
    </cw-empty-header>
  </cw-empty>
</div>
