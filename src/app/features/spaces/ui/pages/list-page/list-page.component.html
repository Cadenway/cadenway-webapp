@let list = store.list.value();
@if (list) {
  <div class="flex shrink-0 flex-col gap-3 px-4 pt-3 sm:px-6">
    <cw-list-header
      [list]="list"
      [space]="space()"
      [spaceLink]="spaceLink(list)"
      [counts]="store.counts.hasValue() ? store.counts.value().counts : null"
      [sprintRange]="sprintRange(list)"
      [favorite]="favorite()"
      [members]="store.members.hasValue() ? store.members.value() : null"
      [showSidebarToggle]="sidebar !== null && !sidebar.expanded()"
      [saving]="renaming()"
      [(editing)]="editing"
      (sidebarToggled)="sidebar?.toggle()"
      (renamed)="rename($event)"
      (favoriteToggled)="toggleFavorite(list)"
      (duplicated)="duplicate()"
      (exported)="exportCsv()"
      (linkCopied)="copyLink(list)"
      (archived)="archive(list)"
      (deleteRequested)="deleteOpen.set(true)"
    />

    <cw-view-tabs
      [layouts]="layouts"
      [layout]="view.layout()"
      [savedViews]="store.savedViews.hasValue() ? store.savedViews.value() : []"
      [activeViewId]="view.savedView()?.id ?? null"
      [modified]="view.modified()"
      [canEdit]="canEdit()"
      (layoutPicked)="pickLayout($event)"
      (savedPicked)="pickSaved($event)"
      (saveRequested)="openSaveDialog()"
      (settingsSaved)="saveSettings()"
      (reverted)="revert($event)"
      (renameRequested)="openRenameDialog($event)"
      (duplicated)="duplicateView($event)"
      (deleted)="deleteView($event)"
    />

    <cw-view-tools
      [config]="view.config()"
      [statuses]="statuses()"
      [labels]="store.labels.hasValue() ? store.labels.value() : []"
      [search]="view.search()"
      [milestonesOnly]="view.milestonesOnly()"
      [milestoneCount]="store.milestoneCount.hasValue() ? store.milestoneCount.value() : null"
      [taskTotal]="store.counts.hasValue() ? store.counts.value().counts.total : null"
      [savedView]="view.savedView()"
      [modified]="view.modified()"
      [canSave]="view.canSave() && canEdit()"
      (milestonesToggled)="view.toggleMilestones()"
      (filterToggled)="view.toggleFilter($event.field, $event.value)"
      (filterCleared)="view.clearFilter($event)"
      (filtersCleared)="view.clearFilters()"
      (sortChanged)="view.setSort($event)"
      (sortDirectionToggled)="view.toggleSortDirection()"
      (groupChanged)="view.setGroupBy($event)"
      (subtasksChanged)="view.setSubtasks($event)"
      (searchChanged)="view.setSearch($event)"
      (saveRequested)="openSaveDialog()"
      (savedReverted)="view.revert()"
      (savedUpdated)="saveSettings()"
    />
  </div>

  <div class="relative flex min-h-0 flex-1 flex-col">
    <router-outlet />
  </div>

  <cw-save-view-dialog
    [(open)]="dialogOpen"
    [mode]="dialogView() ? 'rename' : 'create'"
    [summary]="dialogSummary()"
    [placeholder]="dialogPlaceholder()"
    [layoutIcon]="dialogIcon()"
    [layoutName]="layoutNames[dialogLayout()]"
    [initialName]="dialogView()?.name ?? ''"
    [initialIcon]="dialogView()?.icon ?? null"
    [pending]="dialogPending()"
    (submitted)="submitDialog($event)"
  />

  <cw-alert-dialog
    variant="destructive"
    size="sm"
    [(open)]="deleteOpen"
    [confirmText]="list.name"
    [pending]="deleting()"
    data-testid="list-delete-dialog"
    (confirm)="confirmDelete(list)"
  >
    <cw-alert-dialog-media>
      <ng-icon name="phosphorWarningCircleFill" aria-hidden="true" />
    </cw-alert-dialog-media>
    <h2 cwAlertDialogTitle>{{ deleteTitle(list) }}</h2>
    <p cwAlertDialogDescription>{{ deleteText() }}</p>
    <button cwButton cwAlertDialogCancel variant="outline" i18n="@@spaces.cancel">Cancel</button>
    <button
      cwButton
      cwAlertDialogAction
      variant="destructive"
      [loading]="deleting()"
      data-testid="list-delete-confirm"
    >
      <ng-container i18n="@@spaces.header.delete">Delete the list</ng-container>
    </button>
  </cw-alert-dialog>
} @else {
  <div class="flex flex-col gap-3 px-4 pt-3 sm:px-6" aria-busy="true" data-testid="list-loading">
    <div cwSkeleton class="h-4 w-40"></div>
    <div cwSkeleton class="h-8 w-64"></div>
    <div cwSkeleton class="h-4 w-56"></div>
    <div cwSkeleton class="h-9 w-full"></div>
  </div>
}
