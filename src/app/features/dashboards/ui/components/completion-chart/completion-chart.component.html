<section
  class="flex min-w-0 flex-1 flex-col gap-3 rounded-xl border border-border bg-card p-4"
  aria-labelledby="dashboards-completions-title"
  [attr.aria-busy]="busy() ? 'true' : null"
>
  <div class="flex flex-wrap items-center gap-2">
    <h2
      id="dashboards-completions-title"
      class="text-base font-semibold"
      i18n="@@dashboards.chart.title"
    >
      Tasks completed per week
    </h2>
    <button
      cwButton
      type="button"
      variant="ghost"
      size="sm"
      class="ml-auto"
      data-testid="completion-view"
      (click)="toggle()"
    >
      <ng-icon name="phosphorTableBold" aria-hidden="true" />{{ toggleLabel() }}
    </button>
  </div>
  @if (view() === 'chart') {
    <cw-chart
      type="bar"
      x="week"
      [legend]="false"
      [data]="data()"
      [series]="series"
      [ariaLabel]="ariaLabel()"
      [categoryFormat]="categoryFormat()"
      [categoryHeader]="weekHeader"
    />
    <p class="text-xs text-muted-foreground" i18n="@@dashboards.chart.caption">
      The last bar is the current week.
    </p>
  } @else {
    <cw-table-container>
      <table
        cwTable
        size="sm"
        aria-labelledby="dashboards-completions-title"
        data-testid="completion-table"
      >
        <thead cwTableHeader>
          <tr cwTableRow>
            <th cwTableHead>{{ weekHeader }}</th>
            <th cwTableHead align="end" class="w-32">{{ series[0].label }}</th>
          </tr>
        </thead>
        <tbody cwTableBody>
          @for (bar of bars(); track $index) {
            <tr cwTableRow>
              <td cwTableCell>{{ bar.label }}</td>
              <td cwTableCell align="end" class="tabular-nums">{{ bar.completed }}</td>
            </tr>
          }
        </tbody>
      </table>
    </cw-table-container>
  }
</section>
