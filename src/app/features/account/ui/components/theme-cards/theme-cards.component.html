<ng-template #preview let-scheme>
  <span
    class="flex h-20 gap-1.5 overflow-hidden rounded-md border border-border bg-canvas p-1.5"
    aria-hidden="true"
    [attr.data-theme]="scheme"
  >
    <span class="flex w-5 flex-col items-center gap-1 pt-0.5">
      <span class="size-3 rounded-[3px] bg-sidebar-primary"></span>
      <span class="size-2.5 rounded-[3px] bg-selected"></span>
      <span class="size-2.5 rounded-[3px] bg-stone"></span>
    </span>
    <span class="flex flex-1 flex-col gap-1 rounded-[4px] border border-border bg-background p-1.5">
      <span class="h-1.5 w-1/2 rounded-full bg-foreground"></span>
      <span class="flex items-center gap-1">
        <span class="size-1.5 rounded-full bg-balise"></span>
        <span class="h-1 w-3/4 rounded-full bg-track"></span>
      </span>
      <span class="flex items-center gap-1">
        <span class="size-1.5 rounded-full bg-jade"></span>
        <span class="h-1 w-2/3 rounded-full bg-track"></span>
      </span>
      <span class="mt-auto h-2.5 w-8 self-end rounded-[3px] bg-foreground"></span>
    </span>
  </span>
</ng-template>

<ng-template #name let-card>
  <span class="flex items-center gap-1.5 text-sm font-medium">
    <ng-icon class="text-muted-foreground" aria-hidden="true" [name]="card.icon" />
    {{ card.label }}
  </span>
</ng-template>

<cw-radio-group
  class="grid-cols-1 sm:grid-cols-3"
  [attr.aria-labelledby]="labelledBy()"
  [value]="preference()"
  (valueChange)="choose($event)"
>
  <label
    #cardBox
    class="flex cursor-pointer flex-col gap-2 rounded-lg border border-border p-2 text-left transition-colors hover:bg-muted has-focus-visible:ring-2 has-focus-visible:ring-ring has-focus-visible:ring-offset-2 has-focus-visible:ring-offset-background has-[[data-state=checked]]:border-primary/50 has-[[data-state=checked]]:bg-primary/5 has-[[data-state=checked]]:hover:bg-primary/10 motion-reduce:transition-none"
    for="account-preferences-theme-light"
  >
    <ng-container [ngTemplateOutlet]="preview" [ngTemplateOutletContext]="{ $implicit: 'light' }" />
    <span class="flex items-center gap-2 px-0.5">
      <cw-radio-group-item id="account-preferences-theme-light" value="light" />
      <ng-container [ngTemplateOutlet]="name" [ngTemplateOutletContext]="{ $implicit: cards[0] }" />
    </span>
  </label>
  <label
    #cardBox
    class="flex cursor-pointer flex-col gap-2 rounded-lg border border-border p-2 text-left transition-colors hover:bg-muted has-focus-visible:ring-2 has-focus-visible:ring-ring has-focus-visible:ring-offset-2 has-focus-visible:ring-offset-background has-[[data-state=checked]]:border-primary/50 has-[[data-state=checked]]:bg-primary/5 has-[[data-state=checked]]:hover:bg-primary/10 motion-reduce:transition-none"
    for="account-preferences-theme-dark"
  >
    <ng-container [ngTemplateOutlet]="preview" [ngTemplateOutletContext]="{ $implicit: 'dark' }" />
    <span class="flex items-center gap-2 px-0.5">
      <cw-radio-group-item id="account-preferences-theme-dark" value="dark" />
      <ng-container [ngTemplateOutlet]="name" [ngTemplateOutletContext]="{ $implicit: cards[1] }" />
    </span>
  </label>
  <label
    #cardBox
    class="flex cursor-pointer flex-col gap-2 rounded-lg border border-border p-2 text-left transition-colors hover:bg-muted has-focus-visible:ring-2 has-focus-visible:ring-ring has-focus-visible:ring-offset-2 has-focus-visible:ring-offset-background has-[[data-state=checked]]:border-primary/50 has-[[data-state=checked]]:bg-primary/5 has-[[data-state=checked]]:hover:bg-primary/10 motion-reduce:transition-none"
    for="account-preferences-theme-system"
  >
    <ng-container [ngTemplateOutlet]="preview" [ngTemplateOutletContext]="{ $implicit: shown() }" />
    <span class="flex items-center gap-2 px-0.5">
      <cw-radio-group-item id="account-preferences-theme-system" value="system" />
      <ng-container [ngTemplateOutlet]="name" [ngTemplateOutletContext]="{ $implicit: cards[2] }" />
    </span>
  </label>
</cw-radio-group>
