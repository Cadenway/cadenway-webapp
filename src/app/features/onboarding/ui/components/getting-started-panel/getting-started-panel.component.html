<section
  aria-label="Getting started"
  i18n-aria-label="@@onboarding.getting-started.title"
  class="fixed right-4 bottom-4 z-30 w-[calc(100%-2rem)] max-w-xs rounded-xl border border-border bg-popover text-popover-foreground shadow-lg max-md:bottom-[4.5rem]"
  data-testid="getting-started-panel"
>
  <div class="flex items-center gap-2 p-3">
    <span
      class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary"
      aria-hidden="true"
    >
      <ng-icon name="phosphorRocketLaunchBold" class="size-4" />
    </span>
    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <span class="text-sm font-medium" i18n="@@onboarding.getting-started.title"
        >Getting started</span
      >
      <span class="flex items-center gap-2">
        <cw-progress
          size="sm"
          class="min-w-0 flex-1"
          ariaLabel="Getting started"
          i18n-ariaLabel="@@onboarding.getting-started.title"
          [value]="doneCount()"
          [max]="items().length"
          [valueText]="counter()"
          data-testid="getting-started-progress"
        />
        <span
          class="text-xs text-muted-foreground tabular-nums"
          aria-hidden="true"
          data-testid="getting-started-counter"
          >{{ counter() }}</span
        >
      </span>
    </div>
    <button
      cwButton
      type="button"
      variant="ghost"
      size="icon-sm"
      class="shrink-0 text-muted-foreground"
      aria-label="Collapse the list"
      i18n-aria-label="@@onboarding.getting-started.toggle"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="expanded() ? listId : null"
      (click)="toggled.emit()"
      data-testid="getting-started-toggle"
    >
      <ng-icon
        [name]="expanded() ? 'phosphorCaretDownBold' : 'phosphorCaretUpBold'"
        class="size-4"
        aria-hidden="true"
      />
    </button>
    <button
      cwButton
      type="button"
      variant="ghost"
      size="icon-sm"
      class="shrink-0 text-muted-foreground"
      aria-label="Hide “Getting started”"
      i18n-aria-label="@@onboarding.getting-started.dismiss"
      (click)="dismissed.emit()"
      data-testid="getting-started-dismiss"
    >
      <ng-icon name="phosphorXBold" class="size-4" aria-hidden="true" />
    </button>
  </div>

  @if (expanded()) {
    <ul [id]="listId" class="flex flex-col gap-px border-t border-border p-1">
      @for (item of items(); track item.key) {
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left text-sm transition-colors hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background focus-visible:outline-none"
            [attr.aria-label]="item.done ? doneLabel(item.key) : null"
            [attr.data-testid]="'getting-started-item-' + item.key"
            (click)="picked.emit(item.key)"
          >
            @if (item.done) {
              <ng-icon
                name="phosphorCheckCircleFill"
                class="size-4 shrink-0 text-jade"
                aria-hidden="true"
              />
            } @else {
              <span
                class="size-4 shrink-0 rounded-full border-2 border-line-control"
                aria-hidden="true"
              ></span>
            }
            <span
              class="min-w-0 flex-1"
              [class.text-muted-foreground]="item.done"
              [class.line-through]="item.done"
              >{{ label(item.key) }}</span
            >
            @if (!item.done) {
              <ng-icon
                name="phosphorArrowRightBold"
                class="size-3.5 shrink-0 text-muted-foreground"
                aria-hidden="true"
              />
            }
          </button>
        </li>
      }
    </ul>
    @if (allDone()) {
      <p
        class="border-t border-border px-3 py-2 text-xs text-muted-foreground"
        i18n="@@onboarding.getting-started.all-done"
        data-testid="getting-started-all-done"
      >
        All set. You can hide this list.
      </p>
    }
  }
</section>
