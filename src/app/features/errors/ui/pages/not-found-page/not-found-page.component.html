<main class="flex min-h-dvh items-center justify-center px-4 py-10 sm:px-6">
  <div
    class="flex w-full max-w-md flex-col items-center gap-5 text-center text-balance"
    role="alert"
  >
    <span class="flex size-12 items-center justify-center rounded-xl bg-muted">
      <ng-icon name="phosphorLinkBreakBold" class="size-6 text-foreground" aria-hidden="true" />
    </span>
    <div class="flex flex-col items-center gap-2">
      <p class="font-mono text-xs text-muted-foreground">Erreur 404</p>
      <h1 class="text-2xl font-semibold tracking-tight">Page introuvable</h1>
      <p class="text-sm/relaxed text-muted-foreground">
        Le lien est incomplet, ou la page a été déplacée ou supprimée. Vérifiez l’adresse ou
        cherchez ce que vous vouliez ouvrir.
      </p>
    </div>
    <a cwButton routerLink="/accueil">Retour à l’accueil</a>
  </div>
</main>
