@let plan = subscription();
<section
  class="flex flex-col gap-4 rounded-xl border border-border bg-card py-4"
  aria-labelledby="billing-plan-title"
  data-testid="plan-card"
>
  <div class="flex flex-wrap items-start justify-between gap-x-3 gap-y-2 px-4">
    <h2
      id="billing-plan-title"
      class="flex items-center gap-2 text-base leading-5 font-semibold"
      data-testid="plan-title"
    >
      {{ title() }}
    </h2>
    @if (upgradable()) {
      <button
        cwButton
        type="button"
        size="sm"
        [loading]="upgrading()"
        [disabled]="upgrading()"
        (click)="upgradeRequested.emit()"
        data-testid="plan-upgrade"
      >
        <ng-icon name="phosphorRocketLaunchBold" aria-hidden="true" />
        {{ upgradeLabel }}
      </button>
    }
  </div>
  <div class="grid grid-cols-1 border-t border-border">
    <div class="grid content-start gap-1 px-4 pt-4" data-testid="plan-seats">
      <span class="text-xs text-muted-foreground" i18n="@@organization.billing.seats">Seats</span>
      <span class="text-2xl font-semibold tracking-tight whitespace-nowrap tabular-nums"
        >{{ plan.seatsUsed }} / {{ plan.seatsLimit }}</span
      >
      <span class="text-xs text-muted-foreground tabular-nums">{{ seatsFree() }}</span>
    </div>
  </div>
</section>
