<section class="flex flex-col gap-2" [attr.aria-label]="label()">
  <h2 class="flex items-center gap-2 text-sm font-medium" [class.text-grenat-text]="late()">
    {{ label()
    }}<span
      class="text-xs font-normal whitespace-nowrap text-muted-foreground tabular-nums"
      data-testid="my-tasks-group-count"
      >{{ rows().length }}</span
    >
  </h2>
  <ul class="flex flex-col overflow-hidden rounded-lg border border-border">
    @for (row of rows(); track row.task.key) {
      <li
        class="border-b border-border last:border-b-0"
        [cwContextMenuTriggerFor]="menu()"
        (opened)="menuOpened.emit(row.task)"
      >
        <cw-task-line
          variant="mine"
          [task]="row.task"
          [status]="row.status"
          [listName]="row.listName"
          (opened)="opened.emit($event)"
        />
      </li>
    }
  </ul>
</section>
