<cw-split-button
  [label]="ariaLabel()"
  [tooltip]="tooltip()"
  [opensMenu]="next() === null"
  [arrow]="next() !== null"
  [disabled]="disabled()"
  menuLabel="Choose a status"
  i18n-menuLabel="@@task.status-picker.choose"
  (triggered)="advance()"
>
  <cw-status-icon [status]="status()" [from]="from()" [milestone]="milestone()" size="3.5" />
  <span class="truncate">{{ label() }}</span>
  <cw-menu ariaLabel="Status" i18n-ariaLabel="@@task.status-picker.menu">
    @for (group of groups(); track group.category) {
      <cw-menu-group>
        @if (group.heading) {
          <cw-menu-label>{{ group.heading }}</cw-menu-label>
        }
        @for (entry of group.entries; track entry.option.key) {
          <button
            cwMenuItem
            type="button"
            [selected]="entry.option.key === status()"
            (triggered)="choose(entry.option.key)"
          >
            <cw-status-icon [status]="entry.option.key" [milestone]="milestone()" size="4" />
            <span class="flex min-w-0 flex-col">
              <span>{{ entry.option.label }}</span>
              <span class="text-xs text-muted-foreground">{{ entry.hint }}</span>
            </span>
          </button>
        }
      </cw-menu-group>
    }
  </cw-menu>
</cw-split-button>
